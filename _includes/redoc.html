<div class="container">
  <div id="redoc-container"></div>
</div>

<script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
<style>
  /* Container frame; inner theming is handled by Redoc theme config */
  #redoc-container {
    border: 1px solid #333;
    border-radius: 12px;
    padding: 12px;
    line-height: 1.6;
    background: #07081a;
    color: #ddd;
  }
  
  /* Light mode adjustments - only when explicitly in light mode */
  @media (prefers-color-scheme: light) {
    #redoc-container {
      background: #ffffff;
      color: #222;
      border-color: #ddd;
    }
    /* Only override text colors in light mode for better contrast */
    #redoc-container pre,
    #redoc-container code {
      background-color: #f3f4f6 !important;
      color: #0b0d17 !important;
    }
    #redoc-container pre {
      border: 1px solid #e5e7eb !important;
      border-radius: 10px !important;
    }
  }
  
  /* Dark mode specific fixes - ensure good contrast */
  @media (prefers-color-scheme: dark) {
    /* Fix specific readability issues in dark mode */
    #redoc-container {
      background: #07081a !important;
      color: #e6e6e6 !important;
    }
    
    /* Ensure section headers are visible */
    #redoc-container h1,
    #redoc-container h2,
    #redoc-container h3,
    #redoc-container h4,
    #redoc-container h5,
    #redoc-container h6 {
      color: #e6e6e6 !important;
    }
    
    /* Fix Authorization and other section labels */
    #redoc-container [class*="security" i],
    #redoc-container [class*="auth" i],
    #redoc-container [class*="section" i] h3,
    #redoc-container [class*="section" i] h4,
    #redoc-container [class*="section" i] h5 {
      color: #e6e6e6 !important;
    }
    
    /* Fix parameter names and property labels */
    #redoc-container [class*="property" i] > span:first-child,
    #redoc-container [class*="field" i] > span:first-child,
    #redoc-container [class*="param" i] > span:first-child {
      color: #06b6d4 !important;
    }
    
    /* Fix description text in expandable sections */
    #redoc-container [class*="description" i],
    #redoc-container [class*="markdown" i] p,
    #redoc-container li {
      color: #b3b3b3 !important;
    }
    
    /* Code blocks with better contrast */
    #redoc-container pre,
    #redoc-container code {
      background-color: #0d0e23 !important;
      color: #e6e6e6 !important;
      border: 1px solid #333 !important;
      border-radius: 10px !important;
    }
    
    /* Response examples and JSON */
    #redoc-container [class*="response" i] pre,
    #redoc-container [class*="example" i] pre {
      background-color: #0d0e23 !important;
      border: 1px solid #444 !important;
    }
  }
  
  @media (max-width: 768px) { #redoc-container { padding: 8px; } }
  </style>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const SPEC_URL = '{{ include.spec_url | default: "/docs/competition.yaml" }}';
    const redocEl = document.getElementById('redoc-container');
    if (!redocEl) return;

    const themes = {
      // Slate/Cyan palette to pair with deep navy site chrome
      dark: {
        colors: {
          primary: { main: '#06b6d4' },
          text: { primary: '#e6e6e6', secondary: '#b3b3b3' },
          http: { get: '#22c55e', post: '#06b6d4', put: '#f59e0b', delete: '#ef4444' },
          background: { main: '#07081a' }
        },
        typography: {
          fontFamily: 'IBM Plex Sans, Helvetica, Arial, sans-serif',
          headings: { fontFamily: 'IBM Plex Sans, Helvetica, Arial, sans-serif' },
          links: { color: '#06b6d4' },
          code: { backgroundColor: '#0d0e23', textColor: '#e6e6e6' }
        },
        sidebar: { backgroundColor: '#07081a' },
        rightPanel: { backgroundColor: '#07081a' }
      },
      light: {
        colors: {
          primary: { main: '#0891b2' },
          text: { primary: '#0f172a', secondary: '#475569' },
          http: { get: '#16a34a', post: '#0891b2', put: '#d97706', delete: '#dc2626' },
          background: { main: '#ffffff' }
        },
        typography: {
          fontFamily: 'IBM Plex Sans, Helvetica, Arial, sans-serif',
          headings: { fontFamily: 'IBM Plex Sans, Helvetica, Arial, sans-serif' },
          links: { color: '#0891b2' },
          code: { backgroundColor: '#f8fafc', textColor: '#0b0d17' }
        },
        sidebar: { backgroundColor: '#ffffff' },
        rightPanel: { backgroundColor: '#ffffff' }
      }
    };

    const mql = window.matchMedia('(prefers-color-scheme: dark)');
    function currentThemeName() { return mql.matches ? 'dark' : 'light'; }

    function render() {
      // Clear previous render (if any)
      redocEl.innerHTML = '';
      Redoc.init(SPEC_URL, {
        expandResponses: '200,201',
        hideDownloadButton: false,
        theme: themes[currentThemeName()]
      }, redocEl);
    }

    // Initial render
    render();

    // Respond to OS theme changes
    if (typeof mql.addEventListener === 'function') {
      mql.addEventListener('change', render);
    } else if (typeof mql.addListener === 'function') {
      // Safari < 14
      mql.addListener(render);
    }
  });
</script>
