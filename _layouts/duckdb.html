<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description"
        content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

    <!-- SEO -->
    <meta property="og:title"
        content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description"
        content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    {% if page.redirect %}
    <meta http-equiv="refresh" content="0; url={{ page.redirect }}">
    <link rel="canonical" href="{{ page.redirect }}" />
    {% endif %}

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/css/style-aixcc.css">

    <!-- Preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/duckdb_styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@latest/dist/duckdb-mvp.wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@latest/dist/duckdb-browser-mvp.worker.js"></script>
</head>

<body>
    <header>
        <div class="container navbar" role="navigation">
            <a class="brand" href="/">AIxCC Archive</a>
            <div class="spacer"></div>
            <button class="menu-toggle" aria-label="Toggle menu" aria-controls="main-menu" aria-expanded="false">
                <span class="menu-icon" aria-hidden="true"></span>
                Menu
            </button>
            <nav id="main-menu" class="menu" aria-label="Main Navigation">
                <a href="/">Home</a>
                <a href="/api/quickstart/">Getting Started</a>
                <a href="/api/">API Explorer</a>
                <a href="/data/">Data Explorer</a>
                <a href="/challenges/">Challenges</a>
            </nav>
        </div>
    </header>
    {{ content }}
</body>

</html>
